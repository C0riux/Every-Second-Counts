<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab - Every Second Counts</title>
    <link rel="stylesheet" href="styles.css">
    <script src="countdown.js" defer></script>
    <script src="functionality.js" defer></script>
</head>
<body>
    <header>
        <h1>Every Second Counts</h1>
    </header>

    <main>
        <section class="search">
            <form method="get" action="https://www.google.com/search">
                <input type="text" name="q" placeholder="Search with Google...">
            </form>
        </section>

        <section class="addButtonSection">
            <form>
                <input type="button" id="addButton" value="Add A Countdown">
            </form>
            <form id="new-countdown-form">
                <p>Countdown Label</p>
                <input type="text" id="countdownLabel" placeholder="My Countdown">
                <p>Calendar Date of Deadline</p>
                <input type="text" id="countdownDate" placeholder="YYYY-MM-DD">
                <p>Time of Day of Deadline, 24-hour Clock</p>
                <input type="text" id="countdownTime" placeholder="HH:MM:SS">
                <input type="submit" id="submitButton" value="Add New Countdown">
                <p id="feedbackText">feedback</p>
            </form>
        </section>

        <section class="countdownDisplay">
            <div class="countdownList" id="countdownList">
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry2</p>
                </div>
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry3</p>
                </div>
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry4</p>
                </div>
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry5</p>
            </div>
            
            </div>
        </section>
    </main>

    <footer>

    </footer>
</body>
</html>
