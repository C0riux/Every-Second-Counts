<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab - Every Second Counts</title>
    <link rel="stylesheet" href="styles.css">
    <script src="countdown.js" defer></script>
    <script src="functionality.js" defer></script>
</head>
<body>
    <header>
        <h1>Every Second Counts</h1>
    </header>

    <main>
        <section class="search">
            <form method="get" action="https://www.google.com/search">
                <!--Using the "get" method will append input to the end of
                the action URL using the scheme "?[input-name]=[value]"
                It also triggers the form to enact its method immediately upon Enter being pressed
                This allows us to simply create a search box without any javascript at all!-->
                <input type="text" name="q" placeholder="Search with Google...">
            </form>
        </section>

        <section class="addButtonSection">
            <form>
                <input type="button" id="addButton" value="Add A Countdown">
            </form>
            <!--Javascript will later be implemented to collapse this HTML
            and uncollapse it using the button above
            Since the user won't need to constantly make new timers
            That space is better allocated to preexisting ones!-->
            <form id="new-countdown-form">
                <p>Countdown Label</p>
                <input type="text" id="countdownLabel" placeholder="My Countdown">
                <p>Calendar Date of Deadline</p>
                <input type="text" id="countdownDate" placeholder="YYYY-MM-DD">
                <p>Time of Day of Deadline, 24-hour Clock</p>
                <input type="text" id="countdownTime" placeholder="HH:MM:SS">
                <input type="submit" id="submitButton" value="Add New Countdown">
                <p id="feedbackText">feedback</p>
            </form>
        </section>

        <section class="countdownDisplay">
            <div class="countdownList" id="countdownList">
                <!--Temporarily hardcoded HTML to mimick functionality for MVP prototype
                TO BE REMOVED-->
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry2</p>
                </div>
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry3</p>
                </div>
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry4</p>
                </div>
                <div class="countdownCard">
                    <h2>Countdown Name</h2>
                    <p>test entry5</p>
            </div>
            
            </div>
        </section>
    </main>

    <footer>
        <!--Uncertain what to place in the footer, may remove later.-->
    </footer>
</body>
</html>
